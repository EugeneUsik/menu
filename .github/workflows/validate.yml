name: Validate weeks

on:
  push:
    paths:
      - 'data/**.json'
      - 'scripts/**.js'
  pull_request:
    paths:
      - 'data/**.json'
      - 'scripts/**.js'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The food catalog is load-bearing: it supplies nutrition, shopping categories and
      # the canonical ingredient vocabulary. Check it before anything that depends on it.
      - name: Validate food catalog
        run: node scripts/validate-foods.js

      - name: Sync manifest
        run: node scripts/sync-weeks-index.js
      - name: Check manifest is up to date
        run: |
          if ! git diff --exit-code data/weeks/index.json; then
            echo "::error::data/weeks/index.json is out of sync. Run 'node scripts/sync-weeks-index.js' locally and commit the result."
            exit 1
          fi

      - name: Validate all weeks
        run: node scripts/validate-all-weeks.js

      # recent-history.json feeds the cross-week variety check during generation. If it is
      # stale, that check silently passes against outdated data.
      - name: Check recent-history is up to date
        run: |
          node scripts/derive-history.js
          if ! git diff --exit-code data/weeks/recent-history.json; then
            echo "::error::data/weeks/recent-history.json is out of sync. Run 'node scripts/derive-history.js' locally and commit the result."
            exit 1
          fi
