name: Validate weeks

# Keep the two path lists identical, and spelled out rather than YAML-anchored: Actions'
# support for anchors is inconsistent, and a parse failure here means CI silently stops
# running. A change to tests/ or to this workflow must trigger a run, or a broken test
# lands green.
#
# Markdown and .gitignore are in the list because tests/privacy.test.js scans every tracked
# text file for biomarkers and anthropometrics. Without them, adding health data to a doc --
# or dropping the ignore rule that keeps the family context untracked -- would not run the
# check that exists to catch exactly that.
on:
  push:
    paths:
      - 'data/**.json'
      - 'scripts/**.js'
      - 'tests/**.js'
      - '**.md'
      - '.gitignore'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'data/**.json'
      - 'scripts/**.js'
      - 'tests/**.js'
      - '**.md'
      - '.gitignore'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Unit tests first: they cover the conversion, eater-model and budget-severity logic
      # every check below depends on, and they fail in milliseconds.
      - name: Unit tests
        run: node --test tests/*.test.js

      # The food catalog is load-bearing: it supplies nutrition, shopping categories and
      # the canonical ingredient vocabulary. Check it before anything that depends on it.
      - name: Validate food catalog
        run: node scripts/validate-foods.js

      - name: Sync manifest
        run: node scripts/sync-weeks-index.js
      - name: Check manifest is up to date
        run: |
          if ! git diff --exit-code data/weeks/index.json; then
            echo "::error::data/weeks/index.json is out of sync. Run 'node scripts/sync-weeks-index.js' locally and commit the result."
            exit 1
          fi

      - name: Validate all weeks
        run: node scripts/validate-all-weeks.js

      # recent-history.json feeds the cross-week variety check during generation. If it is
      # stale, that check silently passes against outdated data.
      - name: Check recent-history is up to date
        run: |
          node scripts/derive-history.js
          if ! git diff --exit-code data/weeks/recent-history.json; then
            echo "::error::data/weeks/recent-history.json is out of sync. Run 'node scripts/derive-history.js' locally and commit the result."
            exit 1
          fi
