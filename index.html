<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Weekly Menu</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="app-header">
    <div class="header-inner">
      <span class="app-title">Family Menu</span>
      <select id="week-selector" aria-label="Select week"></select>
    </div>
    <nav id="tab-bar" role="tablist" aria-label="Views">
      <button id="tab-menu"     role="tab" data-view="menu"     aria-controls="view-menu"     class="tab active" aria-selected="true">Menu</button>
      <button id="tab-recipes"  role="tab" data-view="recipes"  aria-controls="view-recipes"  class="tab" aria-selected="false">Recipes</button>
      <button id="tab-shopping" role="tab" data-view="shopping" aria-controls="view-shopping" class="tab" aria-selected="false">Shopping</button>
    </nav>
  </header>
  <main id="app-main">
    <div id="view-menu"     class="view active" role="tabpanel" aria-labelledby="tab-menu"></div>
    <div id="view-recipes"  class="view"        role="tabpanel" aria-labelledby="tab-recipes"></div>
    <div id="view-shopping" class="view"        role="tabpanel" aria-labelledby="tab-shopping"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
